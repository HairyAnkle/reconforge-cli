[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge-cli"
version = "0.1.0"
description = "Modular pentest recon pipeline CLI for authorized testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ReconForge Contributors"}]
license = {text = "MIT"}
keywords = ["recon", "security", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console"
]

[project.scripts]
reconforge = "reconforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
